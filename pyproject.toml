[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-scanner-plugin"
version = "0.1.0"
description = "Authenticated mobile-accessible ChatGPT receipt and product-cost plugin"
requires-python = ">=3.12"
dependencies = ["mcp>=1.30,<2", "openpyxl>=3.1.5,<4", "PyJWT[crypto]>=2.10,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
receipt-scanner-server = "receipt_plugin.server:main"

[tool.setuptools]
packages = ["receipt_plugin"]
py-modules = ["cost_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
